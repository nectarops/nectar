version: "3.9"

services:
  nectar:
    image: ${NECTAR_IMAGE:?set NECTAR_IMAGE to a pinned tag or digest}
    user: root
    environment:
      NECTAR_ADDR: ":8080"
      NECTAR_COOKIE_SECURE: "false"
      NECTAR_DATA_DIR: /var/lib/nectar
      NECTAR_DESIRED_DOCKER_VERSION: ${NECTAR_DESIRED_DOCKER_VERSION:-}
      NECTAR_INIT_TOKEN_FILE: /run/secrets/nectar_init_token
      NECTAR_REQUIRE_DOCKER: "true"
    ports:
      - target: 8080
        published: ${NECTAR_WEB_PORT:-8080}
        protocol: tcp
        mode: ingress
    volumes:
      - nectar_data:/var/lib/nectar
      - /var/run/docker.sock:/var/run/docker.sock
    secrets:
      - nectar_init_token
    deploy:
      labels:
        io.nectar.managed: "true"
      replicas: 1
      placement:
        constraints:
          - node.role == manager
          - node.labels.nectar.control == true
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
      update_config:
        parallelism: 1
        order: stop-first
        failure_action: rollback

volumes:
  nectar_data:

secrets:
  nectar_init_token:
    external: true
