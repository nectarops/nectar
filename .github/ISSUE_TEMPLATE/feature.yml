name: Feature proposal
description: Propose a focused improvement.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Describe the concrete workflow or risk, not only a preferred implementation.
    validations: { required: true }
  - type: textarea
    id: proposal
    attributes: { label: Proposed behavior }
    validations: { required: true }
  - type: textarea
    id: alternatives
    attributes: { label: Alternatives and tradeoffs }
  - type: checkboxes
    id: scope
    attributes:
      label: Project fit
      options:
        - label: This remains self-hosted and does not require a paid service for core operation.
          required: true
